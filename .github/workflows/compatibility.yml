# SPDX-License-Identifier: MIT
name: Python compatibility

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  changes:
    name: classify compatibility changes
    runs-on: ubuntu-latest
    outputs:
      scope: ${{ steps.scope.outputs.scope }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Classify changed paths
        id: scope
        env:
          CI_EVENT: ${{ github.event_name }}
          CI_BASE: ${{ github.event.pull_request.base.sha || github.event.before || '' }}
          CI_HEAD: ${{ github.sha }}
        run: |
          python scripts/ci_change_scope.py \
            --event "$CI_EVENT" --base "$CI_BASE" --head "$CI_HEAD"
  python-tests:
    name: python-${{ matrix.python-version }}
    needs: changes
    if: needs.changes.outputs.scope == 'full'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.13', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test dependencies
        run: python -m pip install aiohttp PyYAML
      - name: Unit regression suite
        run: python -m unittest discover -s tests -p 'test_*.py'
      - name: Compile Python
        run: python -m compileall -q custom_components/energy_usage tests
