# SPDX-License-Identifier: MIT
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  isolated:
    # Keep this job present on every PR: protected main requires `isolated`.
    name: isolated
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install validation dependencies
        run: python -m pip install aiohttp PyYAML
      - name: Classify changed paths (fail closed)
        id: scope
        env:
          CI_EVENT: ${{ github.event_name }}
          CI_BASE: ${{ github.event.pull_request.base.sha || github.event.before || '' }}
          CI_HEAD: ${{ github.sha }}
        run: |
          python scripts/ci_change_scope.py \
            --event "$CI_EVENT" --base "$CI_BASE" --head "$CI_HEAD"
      - name: Run canonical release verification
        env:
          VERIFY_RELEASE_CHANGE_BASE: ${{ steps.scope.outputs.base }}
        run: |
          bash scripts/verify-release.sh \
            --scope "${{ steps.scope.outputs.scope }}"
      - name: Check privacy-sensitive tracked paths
        shell: bash
        run: |
          if git ls-files | grep -Ei \
            '(^|/)(secrets|private|scratch|tmp)/|(^|/)\.env($|\.[^.]*$)|\.(age|pem|key|p12|pfx|sqlite|db|zip)$' \
            | grep -Ev '\.env\.[^.]+\.example$'; then
            echo 'Prohibited tracked file path detected' >&2
            exit 1
          fi
      - name: Report CI scope
        run: echo "isolated PASS (${{ steps.scope.outputs.scope }} scope)"
