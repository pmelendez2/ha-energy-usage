# SPDX-License-Identifier: MIT
name: HACS validation

on:
  push:
    branches:
      - main
      - "feature/**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  changes:
    name: classify HACS changes
    runs-on: ubuntu-latest
    outputs:
      scope: ${{ steps.scope.outputs.scope }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Classify changed paths
        id: scope
        env:
          CI_EVENT: ${{ github.event_name }}
          CI_BASE: ${{ github.event.pull_request.base.sha || github.event.before || '' }}
          CI_HEAD: ${{ github.sha }}
        run: |
          python scripts/ci_change_scope.py \
            --event "$CI_EVENT" --base "$CI_BASE" --head "$CI_HEAD"
  hacs:
    name: HACS
    needs: changes
    if: needs.changes.outputs.scope == 'full'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate HACS integration
        uses: hacs/action@main
        with:
          category: integration

  hassfest:
    name: Hassfest
    needs: changes
    if: needs.changes.outputs.scope == 'full'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Home Assistant integration
        uses: home-assistant/actions/hassfest@master
