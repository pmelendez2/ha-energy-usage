version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: America/Los_Angeles

    open-pull-requests-limit: 5

    groups:
      actions-minor-patch:
        update-types:
          - version-update:semver-minor
          - version-update:semver-patch
